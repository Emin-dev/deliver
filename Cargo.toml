[package]
name = "deliver-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded local media-delivery requirement validation"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
